name: بررسی ساختار و شرایط پرونده
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: دریافت مخزن
        uses: actions/checkout@v4
      - name: نصب پایتون
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: اعتبارسنجی مستندات
        run: python3 scripts/validate_structure.py
      - name: آزمون قواعد گام‌به‌گام
        run: python3 -m unittest discover -s tests -v
