name: درخواست پرونده خام
description: لینک تنها، بدون استخراج متن یا بررسی تحلیل
title: "درخواست پرونده: "
body:
  - type: markdown
    attributes:
      value: |
        پیام لینک فقط برای ایجاد case.md است. متن و آپدیت‌ها باید بعداً توسط کاربر ارسال شوند.
  - type: input
    id: url
    attributes:
      label: لینک مستقیم تحلیل در تریدینگ‌ویو
      placeholder: https://www.tradingview.com/chart/...
    validations:
      required: true
  - type: input
    id: market
    attributes:
      label: بازار (اختیاری؛ فقط اگر می‌دانید)
    validations:
      required: false
  - type: input
    id: timeframe
    attributes:
      label: تایم‌فریم (اختیاری)
    validations:
      required: false
  - type: input
    id: analyst
    attributes:
      label: تحلیلگر (اختیاری)
    validations:
      required: false
